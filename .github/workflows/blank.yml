name: Build CV PDF

on:
  push:
    branches:
      - main
    paths:
      - "main.tex"
      - ".github/workflows/build-cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-english \
            texlive-lang-italian

      - name: Build PDF from main.tex
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf "CV2026 - Gabriele Cano Cantelmo.pdf"

      - name: Commit updated PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CV2026 - Gabriele Cano Cantelmo.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Update generated CV PDF"
            git push
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: "CV2026 - Gabriele Cano Cantelmo.pdf"
          if-no-files-found: error
