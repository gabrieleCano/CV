name: Build CV and Cover Letter PDFs

on:
  push:
    branches:
      - main
    paths:
      - "TeX/CV/main.tex"
      - "TeX/CoverLetters/**"
      - ".github/workflows/blank.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CV_SOURCE: TeX/CV/main.tex
  CV_ENG_OUTPUT: PDFs/CV/ENG
  CV_ESP_OUTPUT: PDFs/CV/ESP
  COVER_LETTER_SOURCE: TeX/CoverLetters
  COVER_LETTER_OUTPUT: PDFs/CoverLetters

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed sources
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "cv=true" >> "$GITHUB_OUTPUT"
            echo "cover_letters=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(
            git diff --name-status "$BEFORE" "$AFTER"
          )"

          echo "Changed files:"
          echo "$changed_files"

          if grep -qE $'^[AM][[:space:]]+TeX/CV/main\\.tex$' <<< "$changed_files"; then
            echo "cv=true" >> "$GITHUB_OUTPUT"
          else
            echo "cv=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -qE $'^A[[:space:]]+TeX/CoverLetters/[^[:space:]]+$' <<< "$changed_files"; then
            echo "cover_letters=true" >> "$GITHUB_OUTPUT"
          else
            echo "cover_letters=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install LaTeX
        if: steps.changes.outputs.cv == 'true' || steps.changes.outputs.cover_letters == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-english \
            texlive-lang-spanish

      - name: Fetch GitHub OIDC token for Anthropic WIF
        if: steps.changes.outputs.cv == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN', token);

      - name: Create Spanish source in memory with Claude
        if: steps.changes.outputs.cv == 'true'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01Nm9qj5T4Wj2S6kMomTXwiQ
          ANTHROPIC_ORGANIZATION_ID: 71e7646e-b2af-4ce6-b93f-1a8944c1396a
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0121hdUJqYeYCcUEkHsWfFMw
          ANTHROPIC_WORKSPACE_ID: wrkspc_019DtBXChUDzd1H8Uf7tM1db
          ANTHROPIC_MODEL: claude-sonnet-5
        shell: bash
        run: |
          set -euo pipefail

          pip install --quiet "anthropic>=0.70,<1"

          python3 <<'PY'
          import os
          import pathlib

          from anthropic import Anthropic

          source = pathlib.Path(os.environ["CV_SOURCE"])
          target = pathlib.Path("/tmp/main_es.tex")

          text = source.read_text(encoding="utf-8")
          model = os.environ["ANTHROPIC_MODEL"]

          # Anthropic() auto-detects Workload Identity Federation from the
          # ANTHROPIC_FEDERATION_RULE_ID / ANTHROPIC_ORGANIZATION_ID /
          # ANTHROPIC_SERVICE_ACCOUNT_ID / ANTHROPIC_IDENTITY_TOKEN env vars,
          # exchanges the GitHub OIDC token for a short-lived access token,
          # and refreshes it automatically. No API key needed.
          client = Anthropic()

          message = client.messages.create(
              model=model,
              max_tokens=12000,
              system=(
                  "Translate the human-readable text in this LaTeX CV "
                  "from English to European Spanish (Castilian). "
                  "Preserve every LaTeX command, environment, placeholder, "
                  "URL, email, number, date, and formatting command exactly. "
                  "Do not translate LaTeX commands, command arguments that "
                  "contain technical identifiers, URLs, email addresses, "
                  "company names, product names, or programming technologies. "
                  "Return only the complete translated LaTeX source without "
                  "Markdown code fences."
              ),
              messages=[
                  {
                      "role": "user",
                      "content": text,
                  }
              ],
          )

          translated = "".join(
              block.text for block in message.content if block.type == "text"
          ).strip()

          if not translated:
              raise SystemExit("Claude returned an empty translation")

          if translated.startswith("```"):
              translated = translated.split("\n", 1)[1]
              translated = translated.rsplit("```", 1)[0].strip()

          target.write_text(translated + "\n", encoding="utf-8")
          PY

      - name: Build English CV PDF
        if: steps.changes.outputs.cv == 'true'
        shell: bash
        run: |
          set -euo pipefail

          date_stamp="$(date -u +%Y%m%d)"
          mkdir -p "$CV_ENG_OUTPUT"

          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory "$CV_ENG_OUTPUT" \
            "$CV_SOURCE"

          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory "$CV_ENG_OUTPUT" \
            "$CV_SOURCE"

          mv \
            "$CV_ENG_OUTPUT/main.pdf" \
            "$CV_ENG_OUTPUT/CV Gabriele Cano Cantelmo - ${date_stamp} - Eng.pdf"

      - name: Build Spanish CV PDF
        if: steps.changes.outputs.cv == 'true'
        shell: bash
        run: |
          set -euo pipefail

          date_stamp="$(date -u +%Y%m%d)"
          mkdir -p "$CV_ESP_OUTPUT"

          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory "$CV_ESP_OUTPUT" \
            /tmp/main_es.tex

          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory "$CV_ESP_OUTPUT" \
            /tmp/main_es.tex

          mv \
            "$CV_ESP_OUTPUT/main_es.pdf" \
            "$CV_ESP_OUTPUT/CV Gabriele Cano Cantelmo - ${date_stamp} - Esp.pdf"

      - name: Build cover letter PDF
        if: steps.changes.outputs.cover_letters == 'true'
        shell: bash
        run: |
          set -euo pipefail

          date_stamp="$(date -u +%Y%m%d)"

          mapfile -t added_cover_letters < <(
            git diff \
              --name-only \
              --diff-filter=A \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              -- "$COVER_LETTER_SOURCE"
          )

          if [[ ${#added_cover_letters[@]} -eq 0 ]]; then
            echo "No newly added cover letter found."
            exit 0
          fi

          if [[ ${#added_cover_letters[@]} -gt 1 ]]; then
            echo "More than one cover letter was added."
            echo "The requested output filename would cause a collision."
            exit 1
          fi

          source="${added_cover_letters[0]}"
          mkdir -p "$COVER_LETTER_OUTPUT"

          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory "$COVER_LETTER_OUTPUT" \
            "$source"

          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory "$COVER_LETTER_OUTPUT" \
            "$source"

          generated_pdf="$COVER_LETTER_OUTPUT/$(basename "${source%.tex}.pdf")"

          mv \
            "$generated_pdf" \
            "$COVER_LETTER_OUTPUT/Cover Letter Gabriele Cano Cantelmo - ${date_stamp}.pdf"

      - name: Commit generated PDFs
        if: steps.changes.outputs.cv == 'true' || steps.changes.outputs.cover_letters == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$CV_ENG_OUTPUT"/*.pdf \
            "$CV_ESP_OUTPUT"/*.pdf \
            "$COVER_LETTER_OUTPUT"/*.pdf \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No generated PDFs to commit."
          else
            git commit -m "Build PDFs [skip ci]"
            git push
          fi

      - name: Upload PDF artifacts
        if: steps.changes.outputs.cv == 'true' || steps.changes.outputs.cover_letters == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: |
            PDFs/CV/ENG/*.pdf
            PDFs/CV/ESP/*.pdf
            PDFs/CoverLetters/*.pdf
          if-no-files-found: error
