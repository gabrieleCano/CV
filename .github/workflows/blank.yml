name: Build CV and Cover Letter PDFs

on:
  push:
    branches:
      - main
    paths:
      - "TeX/CV/main.tex"
      - "TeX/CoverLetters/**"
      - ".github/workflows/blank.yml"
      - ".github/workflows/translate-cv.yml"
      - ".github/workflows/build-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cv: ${{ steps.changes.outputs.cv }}
      cover_letter_source: ${{ steps.changes.outputs.cover_letter_source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed sources
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "cv=true" >> "$GITHUB_OUTPUT"
            echo "cover_letter_source=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(
            git diff --name-status "$BEFORE" "$AFTER"
          )"

          echo "Changed files:"
          echo "$changed_files"

          if grep -qE $'^[AM][[:space:]]+TeX/CV/main\\.tex$' <<< "$changed_files"; then
            echo "cv=true" >> "$GITHUB_OUTPUT"
          else
            echo "cv=false" >> "$GITHUB_OUTPUT"
          fi

          mapfile -t added_cover_letters < <(
            grep -oE $'^A[[:space:]]+TeX/CoverLetters/[^[:space:]]+$' <<< "$changed_files" \
              | sed -E 's/^A[[:space:]]+//'
          )

          if [[ ${#added_cover_letters[@]} -gt 1 ]]; then
            echo "More than one cover letter was added in this push." >&2
            echo "The requested output filename would cause a collision." >&2
            exit 1
          fi

          echo "cover_letter_source=${added_cover_letters[0]:-}" >> "$GITHUB_OUTPUT"

  translate:
    needs: changes
    if: needs.changes.outputs.cv == 'true'
    uses: ./.github/workflows/translate-cv.yml

  build:
    needs: [changes, translate]
    if: always() && needs.changes.result == 'success' && (needs.translate.result == 'success' || needs.translate.result == 'skipped') && (needs.changes.outputs.cv == 'true' || needs.changes.outputs.cover_letter_source != '')
    uses: ./.github/workflows/build-pdfs.yml
    with:
      build_english: ${{ needs.changes.outputs.cv == 'true' }}
      build_spanish: ${{ needs.changes.outputs.cv == 'true' }}
      cover_letter_source: ${{ needs.changes.outputs.cover_letter_source }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated PDFs
        uses: actions/download-artifact@v4
        with:
          name: generated-pdfs
          # upload-artifact strips the shared "PDFs/" ancestor from the
          # paths it stores (see build-pdfs.yml's upload step), so it
          # must be restored here on download.
          path: PDFs

      - name: Commit generated PDFs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            PDFs/CV/ENG/*.pdf \
            PDFs/CV/ESP/*.pdf \
            PDFs/CoverLetters/*.pdf \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No generated PDFs to commit."
          else
            git commit -m "Build PDFs [skip ci]"
            git push
          fi
